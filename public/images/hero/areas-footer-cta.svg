<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="vig2" cx="45%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#131313"/>
      <stop offset="75%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>
    <radialGradient id="pinGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1D8F5A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1D8F5A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="640" fill="url(#vig2)"/>

  <!-- contour arcs -->
  <g stroke="#C9A86A" fill="none" opacity="0.09">
    <circle cx="300" cy="320" r="170" stroke-width="1"/>
    <circle cx="300" cy="320" r="290" stroke-width="0.7"/>
    <circle cx="300" cy="320" r="420" stroke-width="0.5"/>
    <circle cx="300" cy="320" r="560" stroke-width="0.4"/>
  </g>

  <!-- coastline, tighter crop -->
  <path d="M1280,0 C1250,90 1310,170 1270,250 C1230,330 1300,420 1260,500 C1230,560 1270,600 1260,640"
        fill="none" stroke="#C9A86A" stroke-width="1.8" opacity="0.75"/>

  <!-- river hairlines -->
  <path d="M300,190 C560,165 760,205 980,175 C1120,157 1210,168 1266,152" fill="none" stroke="#C9A86A" stroke-width="1" opacity="0.5"/>
  <path d="M700,560 C820,480 940,470 1080,420 C1180,385 1230,395 1262,368" fill="none" stroke="#C9A86A" stroke-width="1" opacity="0.5"/>

  <!-- pins, unlabeled except primary -->
  <g fill="#1D8F5A">
    <circle cx="1130" cy="160" r="6"/>
    <circle cx="880" cy="200" r="6"/>
    <circle cx="930" cy="270" r="6"/>
    <circle cx="1000" cy="380" r="6"/>
    <circle cx="1180" cy="470" r="6"/>
    <circle cx="760" cy="530" r="6"/>
  </g>
  <g fill="none" stroke="#1D8F5A" stroke-width="1.3" opacity="0.55">
    <circle cx="1130" cy="160" r="11"/>
    <circle cx="880" cy="200" r="11"/>
    <circle cx="930" cy="270" r="11"/>
    <circle cx="1000" cy="380" r="11"/>
    <circle cx="1180" cy="470" r="11"/>
    <circle cx="760" cy="530" r="11"/>
  </g>

  <circle cx="1245" cy="365" r="95" fill="url(#pinGlow2)"/>
  <circle cx="1245" cy="365" r="8" fill="#1D8F5A"/>
  <circle cx="1245" cy="365" r="15" fill="none" stroke="#1D8F5A" stroke-width="1.8" opacity="0.7"/>
  <text x="1245" y="333" fill="#FFFFFF" font-size="20" font-weight="800" letter-spacing="4" text-anchor="middle">SUNDERLAND</text>

  <line x1="70" y1="560" x2="430" y2="560" stroke="#C9A86A" stroke-width="1" opacity="0.5"/>
  <text x="70" y="538" fill="#C9A86A" font-size="14" font-weight="700" letter-spacing="5" opacity="0.85">COVERAGE ACROSS THE NORTH EAST</text>
</svg>
